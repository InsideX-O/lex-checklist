<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lex · Админ-панель</title>
<style>
  :root{ color-scheme:dark; --bg:#0f1216; --panel:#171b21; --panel2:#1d222a; --border:#2a3038; --text:#e6e9ee; --muted:#8b93a1;
    --accent:#c9a227; --accent-rgb:201,162,39; --ok:#3fb950; --bad:#e5534b; --warn:#e8cf4d; --on-accent:#1a1305;
    --boosty:#3d8bfd; --patreon:#b06cff; --boost:#ff8a3d; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  button,input,textarea{ font:inherit; }
  .top{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border); }
  .top b{ color:var(--accent); font-size:15px; }
  .top .who{ margin-left:auto; color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn{ background:transparent; border:1px solid var(--border); border-radius:7px; color:var(--text); padding:6px 10px; cursor:pointer; font-weight:600; font-size:12.5px; white-space:nowrap; }
  .btn:hover{ background:rgba(var(--accent-rgb),.10); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn.danger{ border-color:rgba(229,83,75,.6); color:#ff8f88; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .wrap{ max-width:1500px; margin:auto; padding:14px; }
  .gate{ max-width:460px; margin:12vh auto; text-align:center; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; }
  .gate h1{ font-size:18px; margin:0 0 8px; color:var(--accent); }
  .gate p{ color:var(--muted); margin:0 0 16px; }
  .bar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  .bar input{ flex:1 1 260px; min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:8px 10px; outline:none; }
  .bar input:focus{ border-color:var(--accent); }
  .seg{ display:flex; flex-wrap:wrap; gap:6px; }
  .seg button{ border-radius:999px; padding:5px 11px; }
  .seg button.on{ border-color:var(--accent); color:var(--accent); background:rgba(var(--accent-rgb),.12); }
  .main{ display:grid; grid-template-columns:minmax(0,1fr) 440px; gap:14px; align-items:start; }
  .card{ min-width:0; background:var(--panel); border:1px solid var(--border); border-radius:12px; }
  table{ width:100%; border-collapse:collapse; }
  th, td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; font-size:13px; }
  th{ color:var(--muted); font-weight:600; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; }
  tr.row{ cursor:pointer; } tr.row:hover td{ background:rgba(var(--accent-rgb),.05); } tr.row.sel td{ background:rgba(var(--accent-rgb),.10); }
  .mono{ font-family:var(--mono); font-size:12.5px; }
  .muted{ color:var(--muted); }
  .tw{ overflow-x:auto; }
  .chip{ white-space:nowrap; display:inline-block; margin:1px 4px 1px 0; padding:1px 8px; border-radius:999px; font-size:11.5px; font-weight:700; border:1px solid currentColor; }
  .chip.boosty{ color:var(--boosty); } .chip.patreon{ color:var(--patreon); } .chip.boost{ color:var(--boost); }
  .chip.blocked{ color:var(--bad); text-decoration:line-through; }
  .chip small{ font-weight:600; opacity:.85; }
  .st-active{ color:var(--ok); font-weight:700; } .st-cycle{ color:var(--warn); } .st-available{ color:var(--accent); } .st-none{ color:var(--muted); }
  .crown{ color:var(--accent); font-weight:700; }
  .pager{ display:flex; gap:8px; align-items:center; justify-content:flex-end; padding:10px; }
  .side{ position:sticky; top:62px; padding:14px; max-height:calc(100vh - 76px); overflow:auto; }
  .side h2{ margin:0 0 2px; font:700 17px var(--mono); color:var(--accent); word-break:break-all; }
  .side h3{ margin:16px 0 6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
  .kv{ display:grid; grid-template-columns:110px 1fr; gap:4px 10px; font-size:13px; }
  .kv span{ color:var(--muted); }
  .acts{ display:flex; flex-wrap:wrap; gap:6px; }
  .acts .grp{ width:100%; display:flex; flex-wrap:wrap; gap:6px; padding:6px 0; border-top:1px dashed var(--border); }
  .acts .grp:first-child{ border-top:0; }
  .log{ font-size:12.5px; }
  .log div{ padding:6px 0; border-top:1px solid var(--border); }
  .log b{ color:var(--text); }
  .msg{ min-height:18px; font-size:12.5px; margin:8px 0 0; }
  .msg.ok{ color:var(--ok); } .msg.bad{ color:var(--bad); } .msg.warn{ color:var(--warn); }
  .ov{ position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.6); }
  .ov.open{ display:flex; }
  .modal{ width:min(460px,100%); background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .modal h3{ margin:0 0 4px; color:var(--accent); font-size:16px; }
  .modal .sub{ color:var(--muted); font-size:12.5px; margin:0 0 12px; word-break:break-all; }
  .modal label{ display:grid; gap:4px; font-size:12px; color:var(--muted); margin-bottom:10px; }
  .modal input, .modal textarea{ background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--text); padding:7px 9px; outline:none; }
  .modal textarea{ min-height:80px; resize:vertical; }
  .modal input:focus, .modal textarea:focus{ border-color:var(--accent); }
  .modal .row2{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
  .empty{ padding:20px; text-align:center; color:var(--muted); }
  [hidden]{ display:none !important; }
  @media (max-width:1000px){ .main{ grid-template-columns:minmax(0,1fr); } .side{ position:static; max-height:none; } }
  @media (max-width:640px){ .hide-sm{ display:none; } th, td{ padding:7px 6px; font-size:12.5px; } td .mono{ font-size:11.5px; word-break:break-all; } .top .who{ display:none; } .top b{ font-size:14px; } }
</style>
</head>
<body>
<div class="top">
  <b>Lex · Админ-панель</b>
  <span class="who" id="who"></span>
  <button class="btn" id="b_reload" hidden>Обновить</button>
  <button class="btn" id="b_logout" hidden>Выйти</button>
</div>

<div class="gate" id="gate">
  <h1 id="gate_h">Проверка…</h1>
  <p id="gate_p"></p>
  <button class="btn primary" id="b_login" hidden>Войти через Discord</button>
</div>

<div class="wrap" id="app" hidden>
  <div class="bar">
    <input id="q" type="search" placeholder="Поиск: Discord-ник, Discord ID, почта" autocomplete="off">
    <div class="seg" id="flt">
      <button class="btn on" data-f="all">Все</button>
      <button class="btn" data-f="trial_active">Триал</button>
      <button class="btn" data-f="cycle">Цикл</button>
      <button class="btn" data-f="available">Доступен</button>
      <button class="btn" data-f="sub">Подписка</button>
      <button class="btn" data-f="premium">Премиум</button>
      <button class="btn" data-f="free">Free</button>
    </div>
  </div>
  <div class="main">
    <div class="card">
      <div class="tw"><table>
        <thead><tr><th>Пользователь</th><th>Триал</th><th>Подписки</th><th>Премиум</th><th class="hide-sm">Последний вход</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div class="empty" id="list_msg" hidden></div>
      <div class="pager"><span class="muted" id="pg_info"></span><button class="btn" id="pg_prev">←</button><button class="btn" id="pg_next">→</button></div>
    </div>
    <div class="card side" id="side">
      <div class="empty" id="side_empty">Выберите пользователя в списке.</div>
      <div id="side_body" hidden>
        <h2 id="u_id"></h2>
        <div class="muted" id="u_name"></div>
        <h3>Статус</h3>
        <div class="kv" id="u_kv"></div>
        <h3>Действия</h3>
        <div class="acts" id="u_acts"></div>
        <div class="msg" id="u_msg"></div>
        <h3>Журнал по пользователю</h3>
        <div class="log" id="u_log"></div>
      </div>
    </div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="m_title"></h3>
    <p class="sub" id="m_sub"></p>
    <label id="m_days_w">Дней <input id="m_days" type="number" min="0" step="1"></label>
    <label>Причина (обязательно, от 3 символов) <textarea id="m_reason" maxlength="300" placeholder="Напр.: купил Boosty 15.10, вебхук не пришёл"></textarea></label>
    <div class="msg" id="m_msg"></div>
    <div class="row2"><button class="btn" id="m_cancel">Отмена</button><button class="btn primary" id="m_ok" disabled>Подтвердить</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';
  const SB_URL = 'https://acokvcbfxrzfrgppvvzq.supabase.co';
  const SB_ANON = 'sb_publishable_hlPdJC0PpBVte2Uas1zYQg_YVVeTx7B';
  const BOT = 'https://lex-bot.insidex.workers.dev';
  const PER = 50;
  const $ = id=> document.getElementById(id);
  const el = (t, c, x)=>{ const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
  const fmt = iso=>{ if(!iso) return ''; const d = new Date(iso); if(isNaN(d)) return ''; const p = n=> String(n).padStart(2, '0'); return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear(); };
  const fmtT = iso=>{ if(!iso) return ''; const d = new Date(iso); if(isNaN(d)) return ''; const p = n=> String(n).padStart(2, '0'); return fmt(iso) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); };
  const daysLeft = iso=>{ const t = Date.parse(iso || ''); return isNaN(t) ? null : Math.max(0, Math.ceil((t - Date.now()) / 864e5)); };

  let sb = null, session = null;
  const S = { q:'', filter:'all', page:1, items:[], sel:null, total:null };

  function gate(h, p, login){ $('gate').hidden = false; $('app').hidden = true; $('gate_h').textContent = h; $('gate_p').textContent = p || ''; $('b_login').hidden = !login; }

  /* ---------- API ---------- */
  function api(path, opts){
    if(!session) return Promise.resolve({ ok:false, error:'not_authenticated', _http:401 });
    const o = Object.assign({ method:'GET' }, opts || {});
    o.headers = { Authorization: 'Bearer ' + session.access_token };
    if(o.body){ o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.body); }
    return fetch(BOT + path, o).then(r=> r.json().catch(()=> ({ ok:false, error:'bad_response' })).then(j=>{ if(!j || typeof j !== 'object') j = { ok:false, error:'bad_response' }; j._http = r.status; if(r.status === 403) j.error = j.error || 'forbidden'; return j; }),
      ()=> ({ ok:false, error:'network' }));
  }
  const ERR = {
    reason_required: 'Укажите причину (минимум 3 символа).', forbidden: 'Нет доступа.', not_active: 'Нет активного триала / премиума / правки.',
    not_in_cycle: 'Пользователь не находится в цикле.', unknown_action: 'Неизвестное действие.', bad_request: 'Неверный запрос.',
    not_found: 'Пользователь не найден.', network: 'Нет связи с сервером.', not_authenticated: 'Сессия истекла — войдите снова.'
  };
  const errText = e=> ERR[e] || ('Ошибка: ' + (e || 'неизвестно'));

  /* ---------- список ---------- */
  function loadUsers(){
    const qs = new URLSearchParams({ q: S.q, filter: S.filter, page: String(S.page), per_page: String(PER) });
    $('list_msg').hidden = false; $('list_msg').textContent = 'Загрузка…';
    return api('/admin/users?' + qs).then(r=>{
      if(r && r._http === 403){ gate('Нет доступа', 'Эта страница только для администраторов Lex.', false); $('b_logout').hidden = false; return; }
      if(!r || !r.ok){ $('list_msg').textContent = errText(r && r.error); return; }
      $('gate').hidden = true; $('app').hidden = false; $('b_reload').hidden = false; $('b_logout').hidden = false;
      S.items = Array.isArray(r.items) ? r.items : []; S.total = (typeof r.total === 'number') ? r.total : null;
      renderRows();
    });
  }
  function trialText(t){
    t = t || {}; const st = t.state || 'none';
    if(st === 'active'){ const d = daysLeft(t.expires_at); return ['st-active', 'Триал' + (d != null ? ' · ' + d + ' дн.' : '') + (t.expires_at ? ' (до ' + fmt(t.expires_at) + ')' : '')]; }
    if(st === 'cycle'){ const c = t.cycle || {}; return ['st-cycle', 'Цикл' + (c.day ? ' · день ' + c.day : '') + (c.credited != null ? ' · ' + c.credited + '/28' : '') + (c.skipped != null ? ' · пропуски ' + c.skipped + '/7' : '') + (t.paused ? ' · пауза' : '')]; }
    if(st === 'available') return ['st-available', 'Доступен'];
    return ['st-none', '—'];
  }
  function subsNode(subs){
    const w = el('span'); subs = subs || {};
    [['boosty', 'Boosty'], ['patreon', 'Patreon'], ['boost', 'Буст']].forEach(([k, n])=>{
      const s = subs[k]; if(!s) return;
      const manual = s.source === 'grant' || s.source === 'block';
      if(!s.active && s.source !== 'block') return;
      const c = el('span', 'chip ' + k + (s.source === 'block' ? ' blocked' : ''), n);
      if(manual){ c.appendChild(document.createTextNode(' ')); c.appendChild(el('small', '', s.source === 'block' ? 'блок' : 'вручную' + (s.ends_at ? ' до ' + fmt(s.ends_at) : ''))); }
      w.appendChild(c);
    });
    if(!w.childNodes.length) w.appendChild(el('span', 'muted', '—'));
    return w;
  }
  function premText(p){ p = p || {}; return p.active ? '👑 ' + (p.ends_at ? 'до ' + fmt(p.ends_at) : 'бессрочно') : '—'; }
  function renderRows(){
    const tb = $('rows'); tb.textContent = '';
    S.items.forEach(it=>{
      const tr = el('tr', 'row' + (S.sel === it.discord_id ? ' sel' : ''));
      const u = el('td'); u.appendChild(el('div', 'mono', it.discord_id || '—'));
      const nm = [it.discord_name, it.email].filter(Boolean).join(' · '); if(nm) u.appendChild(el('div', 'muted', nm));
      const [cls, txt] = trialText(it.trial);
      const t = el('td', cls, txt);
      const s = el('td'); s.appendChild(subsNode(it.subs));
      const p = el('td', (it.premium && it.premium.active) ? 'crown' : 'muted', premText(it.premium));
      const l = el('td', 'muted hide-sm', fmtT(it.last_seen) || '—');
      tr.append(u, t, s, p, l);
      tr.addEventListener('click', ()=> loadUserStatus(it.discord_id));
      tb.appendChild(tr);
    });
    $('list_msg').hidden = S.items.length > 0; if(!S.items.length) $('list_msg').textContent = 'Никого не найдено.';
    $('pg_info').textContent = 'Стр. ' + S.page + (S.total != null ? ' · всего ' + S.total : '');
    $('pg_prev').disabled = S.page <= 1;
    $('pg_next').disabled = S.total != null ? S.page * PER >= S.total : S.items.length < PER;
  }

  /* ---------- карточка ---------- */
  function loadUserStatus(id, keepMsg){
    S.sel = id; renderRows();
    $('side_empty').hidden = true; $('side_body').hidden = false; if(!keepMsg && window.innerWidth <= 1000) $('side').scrollIntoView({ behavior:'smooth', block:'start' }); if(!keepMsg) $('u_msg').textContent = ''; $('u_id').textContent = id; $('u_kv').textContent = 'Загрузка…';
    return api('/admin/user?' + new URLSearchParams({ discord_id: id })).then(r=>{
      if(!r || !r.ok){ $('u_kv').textContent = errText(r && r.error); return; }
      renderUser(id, r.status || {}, Array.isArray(r.logs) ? r.logs : []);
    });
  }
  function kv(box, k, v, cls){ box.appendChild(el('span', '', k)); box.appendChild(typeof v === 'string' ? el('div', cls || '', v) : v); }
  function renderUser(id, st, logs){
    $('u_id').textContent = id;
    $('u_name').textContent = [st.discord_name, st.email].filter(Boolean).join(' · ');
    const box = $('u_kv'); box.textContent = '';
    const [cls, txt] = trialText(st.trial); kv(box, 'Триал', txt, cls);
    kv(box, 'Подписки', subsNode(st.subs));
    kv(box, 'Премиум', premText(st.premium), (st.premium && st.premium.active) ? 'crown' : 'muted');
    if(st.last_seen) kv(box, 'Последний вход', fmtT(st.last_seen));
    if(st.created_at) kv(box, 'Создан', fmtT(st.created_at));
    // действия
    const A = $('u_acts'); A.textContent = '';
    const grp = items=>{ const g = el('div', 'grp'); items.forEach(([label, action, kind, cl])=>{ const b = el('button', 'btn' + (cl ? ' ' + cl : ''), label); b.type = 'button'; b.addEventListener('click', ()=> openActionModal(action, id, kind)); g.appendChild(b); }); A.appendChild(g); };
    grp([['Выдать триал', 'trial_grant'], ['Завершить триал', 'trial_end', null, 'danger'], ['Сбросить триал', 'trial_reset', null, 'danger'], ['Засчитать цикл', 'cycle_complete']]);
    [['boosty', 'Boosty'], ['patreon', 'Patreon'], ['boost', 'Буст']].forEach(([k, n])=> grp([['Включить ' + n, 'sub_grant', k], ['Выключить ' + n, 'sub_block', k, 'danger'], ['Как автоматика: ' + n, 'sub_clear', k]]));
    grp([['Выдать Premium', 'premium_grant'], ['Снять Premium', 'premium_revoke', null, 'danger']]);
    // журнал
    const L = $('u_log'); L.textContent = '';
    if(!logs.length){ L.appendChild(el('div', 'muted', 'Пока пусто.')); return; }
    logs.forEach(x=>{
      const d = el('div');
      d.appendChild(el('b', '', (ACT[x.action] || {}).t || x.action || '—'));
      d.appendChild(document.createTextNode(' · ' + (fmtT(x.at) || '') + (x.result ? ' · ' + x.result : '')));
      if(x.reason){ d.appendChild(el('br')); d.appendChild(el('span', 'muted', 'Причина: ' + x.reason)); }
      if(x.admin_discord_id){ d.appendChild(el('br')); d.appendChild(el('span', 'muted mono', 'админ ' + x.admin_discord_id)); }
      L.appendChild(d);
    });
  }

  /* ---------- действия ---------- */
  const ACT = {
    trial_grant:    { t:'Выдать триал', days:7, min:1, max:30, hint:'1–30 дней' },
    trial_end:      { t:'Завершить триал', warn:'Роль снимется сразу, со следующего дня начнётся цикл.' },
    trial_reset:    { t:'Сбросить триал', warn:'Человек вернётся в «триала не было». История сохранится.' },
    cycle_complete: { t:'Засчитать цикл', warn:'Цикл будет засчитан, триал снова станет доступен.' },
    sub_grant:      { t:'Включить подписку', days:30, min:1, max:366, hint:'1–366 дней' },
    sub_block:      { t:'Выключить подписку', days:'', min:0, max:3650, hint:'пусто — до снятия', optional:true },
    sub_clear:      { t:'Снять ручную правку подписки', warn:'Подписка снова будет как решает автоматика.' },
    premium_grant:  { t:'Выдать Premium', days:30, min:0, max:3650, hint:'0 — бессрочно' },
    premium_revoke: { t:'Снять Premium', warn:'Админ-премиум снимется сразу.' },
    denied:         { t:'Отказ в доступе' }
  };
  const SUBN = { boosty:'Boosty', patreon:'Patreon', boost:'Буст' };
  let M = null;
  function openActionModal(action, discordId, subKind){
    const a = ACT[action]; if(!a) return;
    M = { action, discordId, subKind };
    $('m_title').textContent = a.t + (subKind ? ' · ' + SUBN[subKind] : '');
    $('m_sub').textContent = 'Discord ID ' + discordId + (a.warn ? ' — ' + a.warn : '');
    const hasDays = 'days' in a;
    $('m_days_w').hidden = !hasDays;
    if(hasDays){ const d = $('m_days'); d.value = a.days; d.min = a.min; d.max = a.max; d.placeholder = a.hint || ''; $('m_days_w').firstChild.textContent = 'Дней (' + a.hint + ') '; }
    $('m_reason').value = ''; $('m_msg').textContent = ''; $('m_msg').className = 'msg';
    $('m_ok').disabled = true; $('m_ok').textContent = 'Подтвердить';
    $('ov').classList.add('open'); setTimeout(()=> $('m_reason').focus(), 30);
  }
  function closeModal(){ $('ov').classList.remove('open'); M = null; }
  function performAction(action, discordId, subKind, days, reason){
    const body = { action, discord_id: discordId, reason };
    if(subKind) body.sub_kind = subKind;
    if(days !== null && days !== undefined && days !== '') body.days = days;
    return api('/admin/action', { method:'POST', body });
  }
  function submitAction(){
    if(!M) return;
    const a = ACT[M.action], reason = $('m_reason').value.trim();
    if(reason.length < 3){ setM(ERR.reason_required, 'bad'); return; }
    let days = null;
    if('days' in a){
      const raw = $('m_days').value.trim();
      if(raw === '' && a.optional) days = null;
      else { days = Number(raw); if(!Number.isInteger(days) || days < a.min || days > a.max){ setM('Дней: ' + a.hint + '.', 'bad'); return; } }
    }
    const ok = $('m_ok'); ok.disabled = true; ok.textContent = 'Выполняю…';
    const target = M.discordId;
    performAction(M.action, target, M.subKind, days, reason).then(r=>{
      if(r && r.ok){
        closeModal();
        $('u_msg').className = 'msg ok'; $('u_msg').textContent = 'Готово: ' + a.t + '.';
        loadUserStatus(target, true); loadUsers();
      } else {
        if(r && r._http === 403){ closeModal(); gate('Нет доступа', 'Эта страница только для администраторов Lex.', false); return; }
        setM(errText(r && r.error), 'bad'); ok.textContent = 'Подтвердить'; validate();
      }
    });
  }
  function setM(t, k){ const m = $('m_msg'); m.textContent = t; m.className = 'msg ' + (k || ''); }
  function validate(){ $('m_ok').disabled = $('m_reason').value.trim().length < 3; }

  /* ---------- вход ---------- */
  function logout(){ (sb ? sb.auth.signOut() : Promise.resolve()).finally(()=>{ session = null; location.reload(); }); }
  function start(){
    if(location.protocol !== 'https:'){ gate('Только на сайте', 'Откройте https://lex-checklist.pages.dev/admin.html', false); return; }
    if(!window.supabase || !window.supabase.createClient){ gate('Не загрузилось', 'Не удалось загрузить библиотеку входа. Обновите страницу.', false); return; }
    sb = window.supabase.createClient(SB_URL, SB_ANON, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'pkce' } });
    sb.auth.onAuthStateChange((ev, s)=>{ session = s || null; });
    sb.auth.getSession().then(({ data })=>{
      session = data && data.session || null;
      if(!session){ gate('Lex · Админ-панель', 'Войдите через Discord. Доступ — только у администраторов.', true); return; }
      const m = session.user && session.user.user_metadata || {};
      $('who').textContent = (m.full_name || m.name || m.user_name || '') + (session.user.email ? ' · ' + session.user.email : '');
      gate('Проверка доступа…', '', false);
      loadUsers();
    });
  }

  /* ---------- кнопки ---------- */
  $('b_login').addEventListener('click', ()=>{
    sb.auth.signInWithOAuth({ provider:'discord', options:{ redirectTo: location.origin + location.pathname, scopes:'identify email' } });
  });
  $('b_logout').addEventListener('click', logout);
  $('b_reload').addEventListener('click', ()=>{ loadUsers(); if(S.sel) loadUserStatus(S.sel); });
  let qt = null;
  $('q').addEventListener('input', ()=>{ clearTimeout(qt); qt = setTimeout(()=>{ S.q = $('q').value.trim(); S.page = 1; loadUsers(); }, 350); });
  $('flt').addEventListener('click', e=>{
    const b = e.target.closest('button[data-f]'); if(!b) return;
    document.querySelectorAll('#flt button').forEach(x=> x.classList.toggle('on', x === b));
    S.filter = b.dataset.f; S.page = 1; loadUsers();
  });
  $('pg_prev').addEventListener('click', ()=>{ if(S.page > 1){ S.page--; loadUsers(); } });
  $('pg_next').addEventListener('click', ()=>{ S.page++; loadUsers(); });
  $('m_cancel').addEventListener('click', closeModal);
  $('m_ok').addEventListener('click', submitAction);
  $('m_reason').addEventListener('input', validate);
  $('ov').addEventListener('click', e=>{ if(e.target === $('ov')) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeModal(); });

  window.LexAdmin = { loadUsers, loadUserStatus, performAction, openActionModal, submitAction, logout };
  start();
})();
</script>
</body>
</html>
